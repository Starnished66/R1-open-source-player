name: Daily build

on:
  schedule:
    # 00:17 in Costa Rica (UTC-6). Scheduled workflows run from the
    # repository's default branch; the offset minute avoids GitHub's busy
    # top-of-hour window.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      r3_base_asset:
        description: Release asset containing the approved R3 Pro II staging image
        required: false
        default: r3proii.upt
        type: string

permissions:
  contents: read

concurrency:
  group: daily-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build player and bootloader
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install repository-cached MIPS musl toolchain
        run: |
          set -euo pipefail
          toolchain_dir="$(scripts/install_mips_toolchain.sh "$RUNNER_TEMP")"
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends file lua5.4 zip

      - name: Build and test
        run: |
          set -euo pipefail
          release_label="Daily Build $(date -u +%F)"
          make -j2 target RELEASE_LABEL="$release_label"
          make bootloader
          make sd_ready_test

      - name: Validate production outputs and plugins
        run: |
          set -euo pipefail
          file compas_player_target open_hiby_bootloader
          test -s compas_player_target
          test -s open_hiby_bootloader
          # Do not use grep -q here: under pipefail its early exit can make
          # readelf receive SIGPIPE and falsely fail an otherwise valid job.
          mipsel-linux-musl-readelf -h compas_player_target \
            | grep 'Machine:.*MIPS' >/dev/null
          mipsel-linux-musl-readelf -h open_hiby_bootloader \
            | grep 'Machine:.*MIPS' >/dev/null
          if strings compas_player_target | grep -Eq \
              'TEST BUILD|TEST_BUILD_TAG|UI_PERF_TRACE|UI_GESTURE_TRACE|UI_HITBOX_DEBUG'; then
            echo 'Diagnostic flags were found in the production player.' >&2
            exit 1
          fi
          find plugins_examples -maxdepth 1 -type f -name '*.lua' -print0 \
            | xargs -0 -r -n1 luac5.4 -p

      - name: Assemble daily artifact
        run: |
          set -euo pipefail
          mkdir -p daily-build
          cp compas_player_target open_hiby_bootloader daily-build/
          cp -a plugins_examples daily-build/
          (
            cd plugins_examples
            zip -q -r ../daily-build/Test-Plugins.zip .
          )
          {
            echo "commit=${GITHUB_SHA}"
            echo "built_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "workflow_run=${GITHUB_RUN_ID}"
            sha256sum compas_player_target open_hiby_bootloader
          } > daily-build/BUILD-INFO.txt

      - name: Upload daily build
        uses: actions/upload-artifact@v4
        with:
          name: hiby-r1-daily-${{ github.run_number }}-${{ github.sha }}
          path: daily-build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  config-r1:
    name: Check R1 staging-image configuration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    env:
      STAGING_IMAGE_SHA256: ${{ secrets.STAGING_IMAGE_SHA256 }}
    steps:
      - name: Validate R1 staging-image configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_IMAGE_SHA256" ]]; then
            echo 'STAGING_IMAGE_SHA256 is not configured; R1 firmware packaging will be skipped.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$STAGING_IMAGE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo 'STAGING_IMAGE_SHA256 is present but invalid.' >&2
            exit 1
          }
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

  package-r1:
    # This is deliberately a workflow artifact, not a GitHub release. The
    # R1 base image is approved and checksum-pinned, but daily builds remain
    # available for validation before the weekly release publishes one.
    name: Package R1 firmware (staging artifact)
    needs: [build, config-r1]
    if: ${{ needs['config-r1'].outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      STAGING_IMAGE_SHA256: ${{ secrets.STAGING_IMAGE_SHA256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install repository-cached MIPS musl toolchain
        run: |
          set -euo pipefail
          toolchain_dir="$(scripts/install_mips_toolchain.sh "$RUNNER_TEMP")"
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"

      - name: Install repack tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            file genisoimage p7zip-full squashfs-tools

      - name: Download R1 build artifact
        uses: actions/download-artifact@v4
        with:
          name: hiby-r1-daily-${{ github.run_number }}-${{ github.sha }}
          path: r1-build

      - name: Download and verify R1 staging image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base
          gh release download staging-image-base \
            --pattern r1.upt --dir base
          test -f base/r1.upt
          echo "$STAGING_IMAGE_SHA256  base/r1.upt" | sha256sum --check

      - name: Repack R1 staging image
        run: |
          set -euo pipefail
          mkdir -p r1-release
          scripts/repack_upt.sh base/r1.upt \
            r1-build/compas_player_target \
            r1-build/open_hiby_bootloader \
            r1-release/r1.upt
          cp r1-build/compas_player_target r1-release/compas_player
          (
            cd r1-release
            sha256sum r1.upt compas_player > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          {
            echo 'board=r1'
            echo "commit=${GITHUB_SHA}"
            echo 'base_asset=r1.upt'
            echo "upt_sha256=$(sha256sum r1-release/r1.upt | awk '{print $1}')"
            echo "player_sha256=$(sha256sum r1-release/compas_player | awk '{print $1}')"
          } > r1-release/BUILD-INFO.txt
          test -s r1-release/r1.upt
          test -s r1-release/compas_player
          test -s r1-release/SHA256SUMS
          test -s r1-release/BUILD-INFO.txt
          (cd r1-release && sha256sum --check SHA256SUMS)

      - name: Upload R1 staging package
        uses: actions/upload-artifact@v4
        with:
          name: hiby-r1-staging-${{ github.run_number }}-${{ github.sha }}
          path: r1-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  build-r3proii:
    # R3 Pro II has not yet been validated on real hardware. Publish the
    # checked binaries as a workflow artifact; the separate, checksum-gated
    # packaging job produces a staging artifact, never a public release.
    name: Build player for R3 Pro II (compile check and artifact)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install repository-cached MIPS musl toolchain
        run: |
          set -euo pipefail
          toolchain_dir="$(scripts/install_mips_toolchain.sh "$RUNNER_TEMP")"
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends file

      - name: Build
        run: |
          set -euo pipefail
          make -j2 target BOARD=r3proii \
            RELEASE_LABEL="Daily Build R3 Pro II (unsupported) $(date -u +%F)"
          make bootloader BOARD=r3proii

      - name: Validate build output
        run: |
          set -euo pipefail
          file compas_player_target_r3proii open_hiby_bootloader_r3proii
          test -s compas_player_target_r3proii
          test -s open_hiby_bootloader_r3proii
          # Do not use grep -q here: under pipefail its early exit can make
          # readelf receive SIGPIPE and falsely fail an otherwise valid job.
          mipsel-linux-musl-readelf -h compas_player_target_r3proii \
            | grep 'Machine:.*MIPS' >/dev/null
          mipsel-linux-musl-readelf -h open_hiby_bootloader_r3proii \
            | grep 'Machine:.*MIPS' >/dev/null

      - name: Assemble R3 Pro II compile artifact
        run: |
          set -euo pipefail
          mkdir -p r3proii-build
          cp compas_player_target_r3proii open_hiby_bootloader_r3proii \
            r3proii-build/
          {
            echo "board=r3proii"
            echo "commit=${GITHUB_SHA}"
            echo "built_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "workflow_run=${GITHUB_RUN_ID}"
            sha256sum compas_player_target_r3proii \
              open_hiby_bootloader_r3proii
          } > r3proii-build/BUILD-INFO.txt

      - name: Upload R3 Pro II compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: hiby-r3proii-daily-${{ github.run_number }}-${{ github.sha }}
          path: r3proii-build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  config-r3proii:
    name: Check R3 Pro II staging-image configuration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    env:
      R3PROII_STAGING_IMAGE_SHA256: ${{ secrets.R3PROII_STAGING_IMAGE_SHA256 }}
      R3_BASE_ASSET: ${{ inputs.r3_base_asset || 'r3proii.upt' }}
    steps:
      - name: Validate R3 Pro II staging-image configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$R3PROII_STAGING_IMAGE_SHA256" ]]; then
            echo 'R3PROII_STAGING_IMAGE_SHA256 is not configured; R3 firmware packaging will be skipped.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$R3PROII_STAGING_IMAGE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo 'R3PROII_STAGING_IMAGE_SHA256 is present but invalid.' >&2
            exit 1
          }
          [[ "$R3_BASE_ASSET" =~ ^[A-Za-z0-9._-]+\.upt$ ]] || {
            echo "Invalid R3 base release asset name: $R3_BASE_ASSET" >&2
            exit 1
          }
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

  package-r3proii:
    # This is deliberately a workflow artifact, not a GitHub release. The
    # R3 base image must be approved and hardware-tested before it can become
    # a public firmware release.
    name: Package R3 Pro II firmware (staging artifact)
    needs: [build-r3proii, config-r3proii]
    if: ${{ needs['config-r3proii'].outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      R3PROII_STAGING_IMAGE_SHA256: ${{ secrets.R3PROII_STAGING_IMAGE_SHA256 }}
      R3_BASE_ASSET: ${{ inputs.r3_base_asset || 'r3proii.upt' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install repository-cached MIPS musl toolchain
        run: |
          set -euo pipefail
          toolchain_dir="$(scripts/install_mips_toolchain.sh "$RUNNER_TEMP")"
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"

      - name: Install repack tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            file genisoimage p7zip-full squashfs-tools

      - name: Download R3 compile artifact
        uses: actions/download-artifact@v4
        with:
          name: hiby-r3proii-daily-${{ github.run_number }}-${{ github.sha }}
          path: r3proii-build

      - name: Download and verify R3 staging image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base
          gh release download staging-image-base \
            --pattern "$R3_BASE_ASSET" --dir base
          test -f "base/$R3_BASE_ASSET"
          echo "$R3PROII_STAGING_IMAGE_SHA256  base/$R3_BASE_ASSET" \
            | sha256sum --check

      - name: Repack R3 Pro II staging image
        run: |
          set -euo pipefail
          mkdir -p r3-release
          BOARD=r3proii scripts/repack_upt.sh \
            "base/$R3_BASE_ASSET" \
            r3proii-build/compas_player_target_r3proii \
            r3proii-build/open_hiby_bootloader_r3proii \
            r3-release/r3proii.upt
          cp r3proii-build/compas_player_target_r3proii \
            r3-release/compas_player_r3proii
          (
            cd r3-release
            sha256sum r3proii.upt compas_player_r3proii > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          {
            echo 'board=r3proii'
            echo "commit=${GITHUB_SHA}"
            echo "base_asset=${R3_BASE_ASSET}"
            echo "upt_sha256=$(sha256sum r3-release/r3proii.upt | awk '{print $1}')"
            echo "player_sha256=$(sha256sum r3-release/compas_player_r3proii | awk '{print $1}')"
          } > r3-release/BUILD-INFO.txt
          test -s r3-release/r3proii.upt
          test -s r3-release/compas_player_r3proii
          test -s r3-release/SHA256SUMS
          test -s r3-release/BUILD-INFO.txt
          (cd r3-release && sha256sum --check SHA256SUMS)

      - name: Upload R3 Pro II staging package
        uses: actions/upload-artifact@v4
        with:
          name: hiby-r3proii-staging-${{ github.run_number }}-${{ github.sha }}
          path: r3-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
