name: Build HiBy R1 Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build HiBy R1 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build open_hiby_player_target
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            messense/rust-musl-cross:mipsel-musl \
            bash -c '
              set -e

              ln -sf "$(which mipsel-unknown-linux-musl-gcc)" /usr/local/bin/mipsel-linux-musl-gcc
              ln -sf "$(which mipsel-unknown-linux-musl-g++)" /usr/local/bin/mipsel-linux-musl-g++
              ln -sf "$(which mipsel-unknown-linux-musl-strip)" /usr/local/bin/mipsel-linux-musl-strip
              ln -sf "$(which mipsel-unknown-linux-musl-ar)" /usr/local/bin/mipsel-linux-musl-ar
              ln -sf "$(which mipsel-unknown-linux-musl-ranlib)" /usr/local/bin/mipsel-linux-musl-ranlib
              ln -sf "$(which mipsel-unknown-linux-musl-objcopy)" /usr/local/bin/mipsel-linux-musl-objcopy

              make open_hiby_player_target

              test -f open_hiby_player_target
              ls -lh open_hiby_player_target
              file open_hiby_player_target
            '

      - name: Verify binary
        run: |
          test -f open_hiby_player_target
          echo "Binary successfully built:"
          ls -lh open_hiby_player_target
          file open_hiby_player_target

      - name: Create automatic main build release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

          cat > release-notes.txt <<EOF
          Automatic HiBy R1 build

          Commit: ${GITHUB_SHA}
          Build: ${GITHUB_RUN_NUMBER}

          Binary: open_hiby_player_target
          EOF

          gh release create "$TAG" \
            open_hiby_player_target \
            --target "$GITHUB_SHA" \
            --title "Latest Build" \
            --notes-file release-notes.txt \
            --latest

      - name: Create version release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          cat > release-notes.txt <<EOF
          HiBy R1 Player ${TAG}

          Commit: ${GITHUB_SHA}

          Binary: open_hiby_player_target
          EOF

          gh release create "$TAG" \
            open_hiby_player_target \
            --verify-tag \
            --title "HiBy R1 Player ${TAG}" \
            --notes-file release-notes.txt \
            --latest
