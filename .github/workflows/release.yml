name: Build HiBy R1 Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build HiBy R1 Firmware
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile Firmware via Docker
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            messense/rust-musl-cross:mipsel-musl \
            bash -c '
              set -e

              echo "Setting up MIPS toolchain..."

              ln -sf "$(which mipsel-unknown-linux-musl-gcc)" \
                /usr/local/bin/mipsel-linux-musl-gcc

              ln -sf "$(which mipsel-unknown-linux-musl-g++)" \
                /usr/local/bin/mipsel-linux-musl-g++

              ln -sf "$(which mipsel-unknown-linux-musl-strip)" \
                /usr/local/bin/mipsel-linux-musl-strip

              echo "Building open_hiby_player_target..."

              make open_hiby_player_target

              echo "=========================================="
              echo "Build completed successfully"
              echo "=========================================="

              ls -lh open_hiby_player_target
              file open_hiby_player_target
            '

      - name: Verify build artifact
        run: |
          test -f open_hiby_player_target

          echo "Artifact:"
          ls -lh open_hiby_player_target

          echo "File information:"
          file open_hiby_player_target

      # Automatic release for every push to main
      - name: Create Automatic Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build-${{ github.sha }}
          name: Latest Build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          body: |
            Automatic HiBy R1 build from main.

            Commit:
            ${{ github.sha }}

          files: |
            open_hiby_player_target

      # Automatic versioned release for v* tags
      - name: Create Version Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HiBy R1 Player ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body: |
            HiBy R1 Player ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

          files: |
            open_hiby_player_target
