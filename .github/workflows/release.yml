name: Build and Release HiBy R1 Firmware

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a version tag (e.g., v1.0.0)
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and setup MIPS toolchain
        run: |
          wget -q https://musl.cc/mipsel-linux-musl-cross.tgz
          tar -xf mipsel-linux-musl-cross.tgz
          # Add the toolchain bin directory to the GitHub Actions PATH
          echo "${{ github.workspace }}/mipsel-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Compile Firmware
        run: |
          make clean
          make target

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # Only run this step if triggered by a tag
        with:
          files: |
            build_target/main.o
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
