name: Build and Release HiBy R1 Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Firmware via Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work messense/rust-musl-cross:mipsel-musl bash -c " \
            apt-get update && \
            apt-get install -y python3 make && \
            ln -sf \$(which mipsel-unknown-linux-musl-gcc) /usr/local/bin/mipsel-linux-musl-gcc && \
            ln -sf \$(which mipsel-unknown-linux-musl-g++) /usr/local/bin/mipsel-linux-musl-g++ && \
            make clean && \
            make target"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Commit Build' }}
          files: |
            open_hiby_player_target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
