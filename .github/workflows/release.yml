name: Build HiBy R1 Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build HiBy R1 Firmware
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ------------------------------------------------------------
      # Compile HiBy R1 target inside MIPS musl Docker container
      # ------------------------------------------------------------
      - name: Compile Firmware via Docker
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            messense/rust-musl-cross:mipsel-musl \
            bash -c '
              set -e

              echo "=========================================="
              echo "Setting up MIPS toolchain aliases"
              echo "=========================================="

              # C compiler
              ln -sf "$(which mipsel-unknown-linux-musl-gcc)" \
                /usr/local/bin/mipsel-linux-musl-gcc

              # C++ compiler
              ln -sf "$(which mipsel-unknown-linux-musl-g++)" \
                /usr/local/bin/mipsel-linux-musl-g++

              # Strip
              ln -sf "$(which mipsel-unknown-linux-musl-strip)" \
                /usr/local/bin/mipsel-linux-musl-strip

              # Binutils
              ln -sf "$(which mipsel-unknown-linux-musl-ar)" \
                /usr/local/bin/mipsel-linux-musl-ar

              ln -sf "$(which mipsel-unknown-linux-musl-ranlib)" \
                /usr/local/bin/mipsel-linux-musl-ranlib

              ln -sf "$(which mipsel-unknown-linux-musl-objcopy)" \
                /usr/local/bin/mipsel-linux-musl-objcopy

              echo ""
              echo "=========================================="
              echo "Verifying toolchain"
              echo "=========================================="

              which mipsel-linux-musl-gcc
              which mipsel-linux-musl-g++
              which mipsel-linux-musl-strip
              which mipsel-linux-musl-ar
              which mipsel-linux-musl-ranlib
              which mipsel-linux-musl-objcopy

              echo ""
              echo "=========================================="
              echo "Building open_hiby_player_target"
              echo "=========================================="

              make open_hiby_player_target

              echo ""
              echo "=========================================="
              echo "Build completed successfully"
              echo "=========================================="

              ls -lh open_hiby_player_target
              file open_hiby_player_target
            '

      # ------------------------------------------------------------
      # Verify final binary
      # ------------------------------------------------------------
      - name: Verify build artifact
        run: |
          if [ ! -f "open_hiby_player_target" ]; then
            echo "ERROR: open_hiby_player_target was not created!"
            exit 1
          fi

          echo "=========================================="
          echo "BUILD ARTIFACT"
          echo "=========================================="

          ls -lh open_hiby_player_target
          file open_hiby_player_target

      # ------------------------------------------------------------
      # Automatic development release from main
      #
      # IMPORTANT:
      # Every main build gets a UNIQUE tag because GitHub releases
      # in this repository are immutable.
      # ------------------------------------------------------------
      - name: Create Latest Build Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-build-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Latest Build
          body: |
            # HiBy R1 Latest Build

            Automatic build from the latest `main` commit.

            Commit:
            `${{ github.sha }}`

            This is an automatically generated development build.
          prerelease: true
          make_latest: true
          files: |
            open_hiby_player_target

      # ------------------------------------------------------------
      # Permanent versioned release
      #
      # Example:
      # git tag v1.0.7
      # git push origin v1.0.7
      # ------------------------------------------------------------
      - name: Create Version Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: HiBy R1 Player ${{ github.ref_name }}
          body: |
            # HiBy R1 Player ${{ github.ref_name }}

            Official versioned build of the HiBy R1 open-source player.

            Version:
            `${{ github.ref_name }}`

            Commit:
            `${{ github.sha }}`
          prerelease: false
          make_latest: true
          files: |
            open_hiby_player_target
