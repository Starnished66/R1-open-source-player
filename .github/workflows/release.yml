name: Build HiBy R1 Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build HiBy R1 Firmware
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # ============================================================
      # BUILD HiBy R1 TARGET
      # ============================================================

      - name: Compile Firmware via Docker
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            messense/rust-musl-cross:mipsel-musl \
            bash -c '
              set -e

              echo "=========================================="
              echo "SETTING UP MIPS TOOLCHAIN"
              echo "=========================================="

              ln -sf "$(which mipsel-unknown-linux-musl-gcc)" \
                /usr/local/bin/mipsel-linux-musl-gcc

              ln -sf "$(which mipsel-unknown-linux-musl-g++)" \
                /usr/local/bin/mipsel-linux-musl-g++

              ln -sf "$(which mipsel-unknown-linux-musl-strip)" \
                /usr/local/bin/mipsel-linux-musl-strip

              ln -sf "$(which mipsel-unknown-linux-musl-ar)" \
                /usr/local/bin/mipsel-linux-musl-ar

              ln -sf "$(which mipsel-unknown-linux-musl-ranlib)" \
                /usr/local/bin/mipsel-linux-musl-ranlib

              ln -sf "$(which mipsel-unknown-linux-musl-objcopy)" \
                /usr/local/bin/mipsel-linux-musl-objcopy

              echo ""
              echo "Toolchain:"
              mipsel-linux-musl-gcc --version | head -1
              mipsel-linux-musl-g++ --version | head -1

              echo ""
              echo "=========================================="
              echo "BUILDING open_hiby_player_target"
              echo "=========================================="

              make open_hiby_player_target

              echo ""
              echo "=========================================="
              echo "BUILD COMPLETED"
              echo "=========================================="

              ls -lh open_hiby_player_target
              file open_hiby_player_target
            '


      # ============================================================
      # VERIFY BINARY
      # ============================================================

      - name: Verify build artifact
        run: |
          echo "=========================================="
          echo "VERIFYING BUILD ARTIFACT"
          echo "=========================================="

          if [ ! -f "open_hiby_player_target" ]; then
            echo "ERROR: open_hiby_player_target was NOT created."
            exit 1
          fi

          echo ""
          echo "Binary found:"
          ls -lh open_hiby_player_target

          echo ""
          echo "File type:"
          file open_hiby_player_target

          echo ""
          echo "=========================================="
          echo "ARTIFACT READY"
          echo "=========================================="


      # ============================================================
      # AUTOMATIC BUILD FROM MAIN
      #
      # Every push to main gets its own immutable release.
      # The actual binary is uploaded to that release.
      # ============================================================

      - name: Create Automatic Build Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

          echo "=========================================="
          echo "CREATING AUTOMATIC BUILD RELEASE"
          echo "=========================================="

          echo "Tag: $TAG"
          echo "Commit: $GITHUB_SHA"
          echo "Binary: open_hiby_player_target"

          gh release create "$TAG" \
            open_hiby_player_target \
            --target "$GITHUB_SHA" \
            --title "HiBy R1 Automatic Build #${GITHUB_RUN_NUMBER}" \
            --notes "Automatic HiBy R1 build from the main branch.

Commit: ${GITHUB_SHA}

Build: ${GITHUB_RUN_NUMBER}

Artifact: open_hiby_player_target" \
            --prerelease \
            --latest=false

          echo ""
          echo "=========================================="
          echo "RELEASE CREATED SUCCESSFULLY"
          echo "=========================================="

          gh release view "$TAG"


      # ============================================================
      # VERSIONED RELEASE
      #
      # Example:
      # git tag v1.0.7
      # git push origin v1.0.7
      # ============================================================

      - name: Create Version Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          echo "=========================================="
          echo "CREATING VERSION RELEASE"
          echo "=========================================="

          echo "Tag: $TAG"
          echo "Commit: $GITHUB_SHA"
          echo "Binary: open_hiby_player_target"

          gh release create "$TAG" \
            open_hiby_player_target \
            --verify-tag \
            --title "HiBy R1 Player ${TAG}" \
            --notes "HiBy R1 Player ${TAG}

Commit: ${GITHUB_SHA}

Artifact: open_hiby_player_target" \
            --latest

          echo ""
          echo "=========================================="
          echo "VERSION RELEASE CREATED SUCCESSFULLY"
          echo "=========================================="

          gh release view "$TAG"
