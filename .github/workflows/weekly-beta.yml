name: Weekly staging beta

on:
  schedule:
    # Every Monday at 13:00 in Costa Rica (UTC-6).
    - cron: "0 19 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-staging-beta
  cancel-in-progress: false

env:
  # The checksum is a repository secret so no Staging Image fingerprint or
  # other internal build detail is committed to the public source tree.
  STAGING_IMAGE_SHA256: ${{ secrets.STAGING_IMAGE_SHA256 }}
  R3PROII_STAGING_IMAGE_SHA256: ${{ secrets.R3PROII_STAGING_IMAGE_SHA256 }}

jobs:
  weekly-beta:
    name: Build, repack, and publish weekly beta
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set weekly release identity
        id: release
        run: |
          release_date=$(date -u +%F)
          echo "tag=weekly-beta-$release_date" >> "$GITHUB_OUTPUT"
          echo "title=Weekly Beta $release_date" >> "$GITHUB_OUTPUT"

      - name: Install repository-cached MIPS musl toolchain
        run: |
          set -euo pipefail
          toolchain_dir="$(scripts/install_mips_toolchain.sh "$RUNNER_TEMP")"
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"

      - name: Install build and repack tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            file genisoimage lua5.4 p7zip-full squashfs-tools zip

      - name: Build and validate player
        env:
          RELEASE_LABEL: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail
          make -j2 target RELEASE_LABEL="$RELEASE_LABEL"
          make bootloader
          make sd_ready_test
          make -j2 target BOARD=r3proii RELEASE_LABEL="$RELEASE_LABEL"
          make bootloader BOARD=r3proii
          file compas_player_target open_hiby_bootloader \
            compas_player_target_r3proii open_hiby_bootloader_r3proii
          mipsel-linux-musl-readelf -h compas_player_target \
            | grep 'Machine:.*MIPS' >/dev/null
          mipsel-linux-musl-readelf -h open_hiby_bootloader \
            | grep 'Machine:.*MIPS' >/dev/null
          mipsel-linux-musl-readelf -h compas_player_target_r3proii \
            | grep 'Machine:.*MIPS' >/dev/null
          mipsel-linux-musl-readelf -h open_hiby_bootloader_r3proii \
            | grep 'Machine:.*MIPS' >/dev/null
          for player in compas_player_target compas_player_target_r3proii; do
            if strings "$player" | grep -Eq \
                'TEST BUILD|TEST_BUILD_TAG|UI_PERF_TRACE|UI_GESTURE_TRACE|UI_HITBOX_DEBUG'; then
              echo "Diagnostic flags were found in $player." >&2
              exit 1
            fi
          done
          find plugins_examples -maxdepth 1 -type f -name '*.lua' -print0 \
            | xargs -0 -r -n1 luac5.4 -p

      - name: Download verified Staging Image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$STAGING_IMAGE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo 'STAGING_IMAGE_SHA256 secret is missing or invalid.' >&2
            exit 1
          }
          [[ "$R3PROII_STAGING_IMAGE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo 'R3PROII_STAGING_IMAGE_SHA256 secret is missing or invalid.' >&2
            exit 1
          }
          mkdir -p base
          gh release download staging-image-base --pattern r1.upt --dir base
          gh release download staging-image-base --pattern r3proii.upt --dir base
          echo "$STAGING_IMAGE_SHA256  base/r1.upt" | sha256sum --check
          echo "$R3PROII_STAGING_IMAGE_SHA256  base/r3proii.upt" | sha256sum --check

      - name: Repack Staging Image
        run: |
          set -euo pipefail
          mkdir -p release
          scripts/repack_upt.sh base/r1.upt compas_player_target \
            open_hiby_bootloader release/r1.upt
          cp compas_player_target release/compas_player
          BOARD=r3proii scripts/repack_upt.sh base/r3proii.upt \
            compas_player_target_r3proii open_hiby_bootloader_r3proii \
            release/r3proii.upt
          cp compas_player_target_r3proii release/compas_player_r3proii
          (
            cd plugins_examples
            zip -q -r ../release/plugin_examples.zip .
          )
          (
            cd release
            sha256sum r1.upt r3proii.upt compas_player \
              compas_player_r3proii plugin_examples.zip > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Validate tracked R1 branding assets in firmware
        run: |
          set -euo pipefail
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          7z x -y release/r1.upt -o"$verify_dir/upt" >/dev/null
          mapfile -t root_chunks < <(find "$verify_dir/upt/ota_v0" -maxdepth 1 \
            -type f -name 'rootfs.squashfs.[0-9]*' -print | LC_ALL=C sort)
          (( ${#root_chunks[@]} > 0 ))
          cat "${root_chunks[@]}" > "$verify_dir/rootfs.squashfs"
          unsquashfs -no-xattrs -d "$verify_dir/root" \
            "$verify_dir/rootfs.squashfs" >/dev/null
          for asset in \
            'assets/r1/etc/logo1.jpeg:/etc/logo1.jpeg' \
            'assets/theme2/boot_animation/en/0.jpg:/usr/resource/litegui/theme2/boot_animation/en/0.jpg' \
            'assets/theme2/boot_animation/en/0.png:/usr/resource/litegui/theme2/boot_animation/en/0.png'; do
            source_path=${asset%%:*}
            image_path=${asset#*:}
            cmp -- "$source_path" "$verify_dir/root$image_path"
          done

      - name: Validate tracked R3 Pro II branding assets in firmware
        run: |
          set -euo pipefail
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          7z x -y release/r3proii.upt -o"$verify_dir/upt" >/dev/null
          mapfile -t root_chunks < <(find "$verify_dir/upt/ota_v0" -maxdepth 1 \
            -type f -name 'rootfs.squashfs.[0-9]*' -print | LC_ALL=C sort)
          (( ${#root_chunks[@]} > 0 ))
          cat "${root_chunks[@]}" > "$verify_dir/rootfs.squashfs"
          unsquashfs -no-xattrs -d "$verify_dir/root" \
            "$verify_dir/rootfs.squashfs" >/dev/null
          for asset in \
            'assets/r3proii/etc/logo1.jpeg:/etc/logo1.jpeg' \
            'assets/r3proii/theme2/boot_animation/en/0.jpg:/usr/resource/litegui/theme2/boot_animation/en/0.jpg' \
            'assets/r3proii/theme2/boot_animation/en/0.png:/usr/resource/litegui/theme2/boot_animation/en/0.png'; do
            source_path=${asset%%:*}
            image_path=${asset#*:}
            cmp -- "$source_path" "$verify_dir/root$image_path"
          done

      - name: Prepare release notes
        run: |
          set -euo pipefail
          {
            cat WHATS_NEW.md
            echo
            echo "---"
            echo
            echo "Built automatically from commit [\`${GITHUB_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/WHATS_NEW.md)."
            echo
            echo "### Downloads"
            echo
            echo "- **r1.upt** — complete R1 firmware update; use only on the HiBy R1."
            echo "- **r3proii.upt** — complete R3 Pro II firmware update; use only on the HiBy R3 Pro II."
            echo "- **compas_player** — standalone Compás Player update for the R1."
            echo "- **compas_player_r3proii** — standalone Compás Player update for the R3 Pro II."
            echo "- **plugin_examples.zip** — all example and test plugins from the repository."
            echo
            echo "R3 Pro II packaging uses the approved staging image and matching board binaries. This weekly prerelease has not been tested on an R3 Pro II device; validate it on hardware before broader deployment."
            echo
            echo "### Update only Compás Player"
            echo
            echo "Copy **compas_player** to **SD/.compas/compas_player** for the R1, or **compas_player_r3proii** to **SD/.compas/compas_player** for the R3 Pro II, replacing the existing file, then reboot the matching device."
            echo
            echo "Checksums are attached in **SHA256SUMS**."
          } > release/RELEASE_NOTES.md

      - name: Publish weekly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/r1.upt release/r3proii.upt \
              release/compas_player release/compas_player_r3proii \
              release/plugin_examples.zip release/SHA256SUMS --clobber
            for legacy_asset in plugins_examples.zip Test-Plugins.zip; do
              if gh release view "$TAG" --json assets --jq '.assets[].name' \
                  | grep -Fx "$legacy_asset" >/dev/null; then
                gh release delete-asset "$TAG" "$legacy_asset" --yes
              fi
            done
            gh release edit "$TAG" --prerelease --title "$TITLE" \
              --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$TAG" release/r1.upt release/r3proii.upt \
              release/compas_player release/compas_player_r3proii \
              release/plugin_examples.zip release/SHA256SUMS \
              --prerelease --target "$GITHUB_SHA" --title "$TITLE" \
              --notes-file release/RELEASE_NOTES.md
          fi

      - name: Preserve package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.tag }}
          path: |
            release/r1.upt
            release/r3proii.upt
            release/compas_player
            release/compas_player_r3proii
            release/plugin_examples.zip
            release/SHA256SUMS
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
